<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}

  /* ── Header ── */
  .header{background:linear-gradient(135deg,#1a1f35 0%,#0d1526 100%);padding:22px 32px;border-bottom:2px solid #2a3a5c;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header h1{font-size:1.45rem;font-weight:700;color:#fff;letter-spacing:.5px}
  .header .sub{font-size:.82rem;color:#8a9ac0;margin-top:4px}
  .today-badge{background:#e74c3c;color:#fff;border-radius:20px;padding:5px 14px;font-size:.78rem;font-weight:600}

  /* ── KPI strip ── */
  .kpis{display:flex;gap:14px;padding:16px 32px;background:#131720;border-bottom:1px solid #1e2a40;flex-wrap:wrap}
  .kpi{background:#1a2235;border:1px solid #2a3a5c;border-radius:10px;padding:12px 20px;flex:1;min-width:140px;text-align:center}
  .kpi .val{font-size:1.4rem;font-weight:700;color:#4fc3f7}
  .kpi .lbl{font-size:.72rem;color:#7a8aaa;margin-top:4px;text-transform:uppercase;letter-spacing:.6px}

  /* ── Controls ── */
  .controls{display:flex;gap:10px;padding:14px 32px;background:#0f1117;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1e2a40}
  .controls input,.controls select{background:#1a2235;border:1px solid #2a3a5c;color:#e0e0e0;border-radius:7px;padding:7px 12px;font-size:.82rem;outline:none}
  .controls input:focus,.controls select:focus{border-color:#4fc3f7}
  .controls label{font-size:.8rem;color:#8a9ac0}
  .btn{background:#1e3a5f;border:1px solid #2a5080;color:#7ec8e3;border-radius:7px;padding:7px 14px;font-size:.8rem;cursor:pointer;transition:.2s}
  .btn:hover{background:#2a4e7a;color:#fff}
  .btn.active{background:#2563ab;color:#fff;border-color:#4fc3f7}

  /* ── Region section ── */
  .region-block{margin:0}
  .region-header{display:flex;align-items:center;gap:10px;padding:10px 32px;background:#131720;border-top:2px solid;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
  .region-header h2{font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .region-header .cnt{font-size:.75rem;background:rgba(255,255,255,.1);border-radius:12px;padding:2px 10px}
  .region-header .bgt{font-size:.75rem;margin-left:auto;color:#aaa}
  .chevron{font-size:.7rem;transition:.25s;margin-left:4px}
  .region-body{overflow:hidden;transition:max-height .35s ease}

  /* ── Gantt ── */
  .gantt-wrap{overflow-x:auto;background:#0f1117;padding:0 32px 12px}
  .gantt-inner{min-width:900px}
  .gantt-header{display:flex;margin-bottom:4px}
  .gantt-labels{width:320px;min-width:320px;flex-shrink:0}
  .gantt-timeline{flex:1;display:flex;border-bottom:1px solid #2a3a5c}
  .gantt-month{font-size:.65rem;color:#5a6a8a;text-align:center;border-left:1px solid #1e2a40;padding:3px 0;white-space:nowrap;overflow:hidden}

  .gantt-row{display:flex;align-items:center;min-height:32px;border-bottom:1px solid #161c28}
  .gantt-row:hover{background:rgba(79,195,247,.05)}
  .gantt-label{width:320px;min-width:320px;flex-shrink:0;padding:4px 8px;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .gantt-label .pid{font-size:.65rem;color:#5a7a9a;min-width:68px}
  .gantt-label .pname{color:#c8d8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gantt-bar-area{flex:1;position:relative;height:32px;display:flex;align-items:center}
  .gantt-bar{position:absolute;height:16px;border-radius:4px;cursor:pointer;transition:.15s;display:flex;align-items:center;overflow:hidden;min-width:4px}
  .gantt-bar:hover{opacity:.85;transform:scaleY(1.15)}
  .gantt-bar .inv-fill{position:absolute;left:0;top:0;height:100%;background:rgba(0,0,0,.35);border-radius:4px 0 0 4px}
  .gantt-bar .bar-label{position:relative;z-index:1;padding:0 5px;font-size:.62rem;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;z-index:20;pointer-events:none}
  .today-line::before{content:'TODAY';position:absolute;top:-18px;left:-18px;font-size:.55rem;color:#e74c3c;font-weight:700;white-space:nowrap}

  /* Phase badges */
  .phase-badge{display:inline-block;border-radius:3px;padding:1px 5px;font-size:.6rem;font-weight:600;white-space:nowrap;flex-shrink:0}

  /* ── Tooltip ── */
  #tooltip{position:fixed;background:#1a2235;border:1px solid #2a5080;border-radius:10px;padding:12px 16px;font-size:.78rem;pointer-events:none;display:none;z-index:9999;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
  #tooltip .tt-title{font-weight:700;font-size:.85rem;color:#7ec8e3;margin-bottom:8px;border-bottom:1px solid #2a3a5c;padding-bottom:6px}
  #tooltip .tt-row{display:flex;justify-content:space-between;gap:12px;margin:3px 0}
  #tooltip .tt-key{color:#7a8aaa}
  #tooltip .tt-val{color:#e0e0e0;text-align:right}

  /* ── Legend ── */
  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 32px;background:#0f1117;border-top:1px solid #1e2a40}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:.75rem;color:#8a9ac0}
  .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}

  /* ── Summary table ── */
  .table-section{padding:24px 32px}
  .section-title{font-size:1rem;font-weight:700;color:#4fc3f7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #1e2a40}
  table{width:100%;border-collapse:collapse;font-size:.76rem}
  thead tr{background:#1a2235}
  th{padding:9px 10px;text-align:left;color:#7ec8e3;font-weight:600;white-space:nowrap;border-bottom:2px solid #2a3a5c}
  td{padding:8px 10px;border-bottom:1px solid #161c28;vertical-align:middle}
  tr:hover td{background:rgba(79,195,247,.04)}
  .num{text-align:right}
  .progress-cell{min-width:80px}
  .progress-bg{background:#1e2a40;border-radius:4px;height:7px;overflow:hidden}
  .progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#27ae60)}

  /* region color vars */
  .r-AMERICAS{border-color:#3498db!important} .r-AMERICAS .cnt{background:#1a3a5c} .r-AMERICAS h2{color:#3498db}
  .r-APAC-N{border-color:#9b59b6!important}   .r-APAC-N   .cnt{background:#2a1a40} .r-APAC-N h2{color:#9b59b6}
  .r-APAC-S{border-color:#e67e22!important}   .r-APAC-S   .cnt{background:#3a2010} .r-APAC-S h2{color:#e67e22}
  .r-EMEA{border-color:#2ecc71!important}      .r-EMEA     .cnt{background:#0a2a18} .r-EMEA h2{color:#2ecc71}

  ::-webkit-scrollbar{height:6px;width:6px} ::-webkit-scrollbar-track{background:#0f1117} ::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:3px}
</style>

// ── Config ──────────────────────────────────────────────────────
const REGION_ORDER   = ['AMERICAS','APAC N','APAC S','EMEA'];
const REGION_COLORS  = {AMERICAS:'#3498db','APAC N':'#9b59b6','APAC S':'#e67e22',EMEA:'#2ecc71'};
const REGION_CSS     = {AMERICAS:'AMERICAS','APAC N':'APAC-N','APAC S':'APAC-S',EMEA:'EMEA'};
const PHASE_COLORS   = {
  'Construction':      '#e74c3c',
  'Design Development':'#3498db',
  'Schematic Design':  '#9b59b6',
  'Planning':          '#f39c12',
  'Procurement':       '#1abc9c',
  'Permitting':        '#e67e22',
  'Conceptual Design': '#2ecc71',
  'Closeout':          '#95a5a6',
  'Cancelled':         '#4a4a4a',
  'Unknown':           '#555',
};

const today     = new Date('2026-07-29');
const CHART_START = new Date('2025-07-01');
const CHART_END   = new Date('2029-01-01');
const TOTAL_DAYS  = (CHART_END - CHART_START) / 86400000;

function daysFrom(d)  { return (new Date(d) - CHART_START) / 86400000; }
function pct(d)       { return Math.max(0, Math.min(100, daysFrom(d) / TOTAL_DAYS * 100)); }
function fmtMoney(v)  { if(!v||v===0) return '—'; if(v>=1e6) return '$'+( v/1e6).toFixed(2)+'M'; return '$'+v.toLocaleString(); }
function fmtDate(s)   { if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ── Build month headers ───────────────────────────────────────
function buildMonthHeaders() {
  const months=[];
  let cur = new Date(CHART_START.getFullYear(), CHART_START.getMonth(), 1);
  while(cur < CHART_END){
    const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const s = Math.max(0,(cur-CHART_START)/86400000);
    const e = Math.min(TOTAL_DAYS,(next-CHART_START)/86400000);
    if(e>s) months.push({label:cur.toLocaleDateString('en-US',{month:'short',year:'2-digit'}),left:(s/TOTAL_DAYS*100).toFixed(3),width:((e-s)/TOTAL_DAYS*100).toFixed(3)});
    cur=next;
  }
  return months;
}

// ── KPIs ─────────────────────────────────────────────────────
function renderKPIs(data){
  const total=data.length;
  const budgetSum=data.reduce((a,p)=>a+(p.budget||0),0);
  const invSum=data.reduce((a,p)=>a+(p.invoiced||0),0);
  const sqftSum=data.reduce((a,p)=>a+(p.sqft||0),0);
  const phaseCounts={};
  data.forEach(p=>phaseCounts[p.phase]=(phaseCounts[p.phase]||0)+1);
  const topPhase=Object.entries(phaseCounts).sort((a,b)=>b[1]-a[1])[0];
  const overallPct=budgetSum>0?Math.round(invSum/budgetSum*100):0;
  document.getElementById('kpiStrip').innerHTML=`
    <div class="kpi"><div class="val">${total}</div><div class="lbl">Total Projects</div></div>
    <div class="kpi"><div class="val">${fmtMoney(budgetSum)}</div><div class="lbl">Total Est. Budget</div></div>
    <div class="kpi"><div class="val">${fmtMoney(invSum)}</div><div class="lbl">Total Invoiced</div></div>
    <div class="kpi"><div class="val">${overallPct}%</div><div class="lbl">Budget Velocity</div></div>
    <div class="kpi"><div class="val">${(sqftSum/1000).toFixed(0)}K</div><div class="lbl">Total Sq Ft</div></div>
    <div class="kpi"><div class="val">${topPhase?topPhase[0]:'—'}</div><div class="lbl">Top Phase (${topPhase?topPhase[1]:0} projects)</div></div>
  `;
}

// ── Legend ────────────────────────────────────────────────────
function renderLegend(){
  const items=Object.entries(PHASE_COLORS).map(([k,c])=>`<div class="legend-item"><div class="legend-dot" style="background:${c}"></div>${k}</div>`).join('');
  document.getElementById('legendBox').innerHTML=`<div style="width:100%;font-size:.75rem;color:#5a6a8a;margin-bottom:4px;font-weight:600;">PHASE LEGEND</div>`+items;
}

const tip=document.getElementById('tooltip');
function showTip(e,p){
  tip.innerHTML=`
    <div class="tt-title">${p.name}</div>
    <div class="tt-row"><span class="tt-key">Project ID</span><span class="tt-val">${p.id}</span></div>
    <div class="tt-row"><span class="tt-key">Phase</span><span class="tt-val">${p.phase}</span></div>
    <div class="tt-row"><span class="tt-key">Region</span><span class="tt-val">${p.region}</span></div>
    <div class="tt-row"><span class="tt-key">Manager</span><span class="tt-val">${p.manager}</span></div>
    <div class="tt-row"><span class="tt-key">Start</span><span class="tt-val">${fmtDate(p.start)}</span></div>
    <div class="tt-row"><span class="tt-key">Est. Const Start</span><span class="tt-val">${fmtDate(p.constStart)}</span></div>
    <div class="tt-row"><span class="tt-key">Est. Occupancy</span><span class="tt-val">${fmtDate(p.end)}</span></div>
    <div class="tt-row"><span class="tt-key">CIP Close</span><span class="tt-val">${fmtDate(p.cipClose)}</span></div>
    <div class="tt-row"><span class="tt-key">Est. Budget</span><span class="tt-val">${fmtMoney(p.budget)}</span></div>
    <div class="tt-row"><span class="tt-key">Invoiced</span><span class="tt-val">${fmtMoney(p.invoiced)}</span></div>
    <div class="tt-row"><span class="tt-key">% Invoiced</span><span class="tt-val">${p.pct}%</span></div>
    <div class="tt-row"><span class="tt-key">Sq Ft</span><span class="tt-val">${p.sqft?p.sqft.toLocaleString():'—'}</span></div>
    <div class="tt-row"><span class="tt-key">Classification</span><span class="tt-val">${p.class||'—'}</span></div>
  `;
  tip.style.display='block';
  moveTip(e);
}
function moveTip(e){
  const x=e.clientX+14,y=e.clientY-10;
  tip.style.left=(x+310>window.innerWidth?x-330:x)+'px';
  tip.style.top =(y+tip.offsetHeight>window.innerHeight?y-tip.offsetHeight-10:y)+'px';
}
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });

// ── Main render ───────────────────────────────────────────────
let allExpanded = true;

function render(data){
  renderKPIs(data);
  const container = document.getElementById('ganttContainer');
  container.innerHTML='';
  const months = buildMonthHeaders();
  const todayPct = pct(today);

  REGION_ORDER.forEach(region=>{
    const rProjects = data.filter(p=>p.region===region);
    if(!rProjects.length) return;
    const color = REGION_COLORS[region];
    const cssClass = REGION_CSS[region];
    const budgetTot = rProjects.reduce((a,p)=>a+(p.budget||0),0);

    const block = document.createElement('div');
    block.className = 'region-block';
    block.dataset.region = region;

    // Region header
    const hdr = document.createElement('div');
    hdr.className = `region-header r-${cssClass}`;
    hdr.style.borderTopColor = color;
    hdr.innerHTML = `
      <span style="font-size:1rem">&#9783;</span>
      <h2>${region}</h2>
      <span class="cnt">${rProjects.length} projects</span>
      <span class="bgt">${fmtMoney(budgetTot)} est. budget</span>
      <span class="chevron" id="chev-${cssClass}">▾</span>`;
    hdr.onclick = () => toggleRegion(cssClass);
    block.appendChild(hdr);

    // Body
    const body = document.createElement('div');
    body.className = 'region-body';
    body.id = `body-${cssClass}`;

    const ganttWrap = document.createElement('div');
    ganttWrap.className = 'gantt-wrap';

    // Inner
    const inner = document.createElement('div');
    inner.className = 'gantt-inner';

    // Month header row
    const ghdr = document.createElement('div');
    ghdr.className = 'gantt-header';
    const glbls = document.createElement('div');
    glbls.className = 'gantt-labels';
    glbls.innerHTML = `<div style="padding:3px 8px;font-size:.68rem;color:#5a6a8a">PROJECT</div>`;
    ghdr.appendChild(glbls);

    const gtl = document.createElement('div');
    gtl.className = 'gantt-timeline';
    gtl.style.position='relative';
    months.forEach(m=>{
      const md=document.createElement('div');
      md.className='gantt-month';
      md.style.left=m.left+'%';
      md.style.width=m.width+'%';
      md.style.position='absolute';
      md.textContent=m.label;
      gtl.appendChild(md);
    });
    gtl.style.height='20px';
    // FY bands
    [2025,2026,2027,2028].forEach(fy=>{
      const fs=new Date(`${fy}-10-01`), fe=new Date(`${fy+1}-09-30`);
      const l=pct(fs), w=pct(fe)-pct(fs);
      if(w>0){
        const band=document.createElement('div');
        band.style.cssText=`position:absolute;left:${l}%;width:${w}%;top:0;bottom:0;background:${fy%2===0?'rgba(255,255,255,.015)':'rgba(0,0,0,.0)'};pointer-events:none;border-left:1px dashed #1e2a40`;
        const lbl=document.createElement('div');
        lbl.style.cssText='position:absolute;top:2px;left:4px;font-size:.58rem;color:#2a3a5c;pointer-events:none';
        lbl.textContent='FY'+(fy+1);
        band.appendChild(lbl);
        gtl.appendChild(band);
      }
    });
    ghdr.appendChild(gtl);
    inner.appendChild(ghdr);

    // Project rows
    rProjects.forEach(p=>{
      const row = document.createElement('div');
      row.className = 'gantt-row';
      row.dataset.pid=p.id; row.dataset.name=p.name.toLowerCase();
      row.dataset.phase=p.phase; row.dataset.mgr=p.manager;

      const label=document.createElement('div');
      label.className='gantt-label';
      const phaseCol=PHASE_COLORS[p.phase]||'#555';
      label.innerHTML=`
        <span class="pid">${p.id}</span>
        <span class="pname" title="${p.name}">${p.name}</span>
        <span class="phase-badge" style="background:${phaseCol}22;color:${phaseCol};border:1px solid ${phaseCol}44">${p.phase}</span>`;
      row.appendChild(label);

      const barArea=document.createElement('div');
      barArea.className='gantt-bar-area';
      barArea.style.position='relative';

      // today line
      const tl=document.createElement('div');
      tl.className='today-line';
      tl.style.left=todayPct+'%';
      barArea.appendChild(tl);

      // main bar
      const s=pct(p.start), e2=pct(p.end);
      const bw=Math.max(0.3,e2-s);
      const bar=document.createElement('div');
      bar.className='gantt-bar';
      bar.style.left=s+'%';
      bar.style.width=bw+'%';
      bar.style.background=`linear-gradient(90deg,${phaseCol}dd,${phaseCol}88)`;
      bar.style.border=`1px solid ${phaseCol}`;
      bar.style.boxShadow=`0 0 6px ${phaseCol}44`;

      // invoiced fill (dark overlay from right)
      if(p.budget>0 && p.pct>0){
        const fill=document.createElement('div');
        fill.className='inv-fill';
        fill.style.left=(100-p.pct)+'%';
        fill.style.width=p.pct+'%';
        bar.appendChild(fill);
      }

      const bl=document.createElement('div');
      bl.className='bar-label';
      bl.textContent=p.manager!=='—'?p.manager:'';
      bar.appendChild(bl);

      bar.addEventListener('mouseenter',e=>showTip(e,p));
      bar.addEventListener('mouseleave',()=>tip.style.display='none');
      barArea.appendChild(bar);

      // const start marker
      if(p.constStart){
        const cs=pct(p.constStart);
        if(cs>s){
          const mk=document.createElement('div');
          mk.style.cssText=`position:absolute;left:${cs}%;top:6px;width:2px;height:20px;background:#ffd700;opacity:.7;border-radius:1px;z-index:5`;
          mk.title='Est. Construction Start';
          barArea.appendChild(mk);
        }
      }

      row.appendChild(barArea);
      inner.appendChild(row);
    });

    ganttWrap.appendChild(inner);
    body.appendChild(ganttWrap);
    block.appendChild(body);
    container.appendChild(block);
  });
}

// ── Filters ──────────────────────────────────────────────────
function populateFilters(){
  const phases=[...new Set(PROJECTS.map(p=>p.phase))].sort();
  const regions=[...new Set(PROJECTS.map(p=>p.region))].sort();
  const mgrs=[...new Set(PROJECTS.map(p=>p.manager).filter(m=>m&&m!=='—'))].sort();
  const pf=document.getElementById('phaseFilter');
  phases.forEach(v=>pf.add(new Option(v,v)));
  const rf=document.getElementById('regionFilter');
  regions.forEach(v=>rf.add(new Option(v,v)));
  const mf=document.getElementById('mgrFilter');
  mgrs.forEach(v=>mf.add(new Option(v,v)));
}

  const q=document.getElementById('searchBox').value.toLowerCase();
  const ph=document.getElementById('phaseFilter').value;
  const re=document.getElementById('regionFilter').value;

  return PROJECTS.filter(p=>
    (!q || p.name.toLowerCase().includes(q)||String(p.id).toLowerCase().includes(q)||p.manager.toLowerCase().includes(q)) &&
    (!ph || p.phase===ph) &&
    (!re || p.region===re) &&
    (!mg || p.manager===mg)
  );
}

function applyFilters(){ render(filtered()); renderTable(filtered()); }
function resetFilters(){
  ['searchBox','phaseFilter','regionFilter','mgrFilter'].forEach(id=>document.getElementById(id).value='');
  render(PROJECTS); renderTable(PROJECTS);
}
document.getElementById('searchBox').addEventListener('input',applyFilters);
document.getElementById('phaseFilter').addEventListener('change',applyFilters);
document.getElementById('regionFilter').addEventListener('change',applyFilters);
document.getElementById('mgrFilter').addEventListener('change',applyFilters);

// ── Toggle regions ────────────────────────────────────────────
function toggleRegion(css){
  const body=document.getElementById(`body-${css}`);
  const chev=document.getElementById(`chev-${css}`);
  if(!body) return;
  if(body.style.maxHeight&&body.style.maxHeight!=='0px'){
    body.style.maxHeight='0px'; chev.textContent='▸';
  } else {
    body.style.maxHeight=body.scrollHeight+'px'; chev.textContent='▾';
  }
}
function toggleAllRegions(){
  const btn=document.getElementById('toggleAll');
  allExpanded=!allExpanded;
  ['AMERICAS','APAC-N','APAC-S','EMEA'].forEach(css=>{
    const body=document.getElementById(`body-${css}`);
    const chev=document.getElementById(`chev-${css}`);
    if(!body) return;
    if(allExpanded){ body.style.maxHeight=body.scrollHeight+'px'; if(chev) chev.textContent='▾'; }
    else           { body.style.maxHeight='0px';                   if(chev) chev.textContent='▸'; }
  });
  btn.textContent = allExpanded ? '⊟ Collapse All' : '⊞ Expand All';
}

// ── Project Register Table ────────────────────────────────────
function renderTable(data){
  const sorted=[...data].sort((a,b)=>{
    const ro=REGION_ORDER;
    if(ro.indexOf(a.region)!==ro.indexOf(b.region)) return ro.indexOf(a.region)-ro.indexOf(b.region);
    return new Date(a.start)-new Date(b.start);
  });
  const tbody=document.getElementById('regBody');
  tbody.innerHTML='';
  sorted.forEach((p,i)=>{
    const rc=REGION_COLORS[p.region]||'#555';
    const pc=PHASE_COLORS[p.phase]||'#555';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="font-weight:600;color:#7ec8e3">${p.id}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.name}">${p.name}</td>
      <td><span style="color:${rc};font-weight:600">${p.region}</span></td>
      <td><span class="phase-badge" style="background:${pc}22;color:${pc};border:1px solid ${pc}44">${p.phase}</span></td>
      <td>${p.manager}</td>
      <td>${fmtDate(p.start)}</td>
      <td>${fmtDate(p.end)}</td>
      <td>${fmtDate(p.cipClose)}</td>
      <td class="num">${fmtMoney(p.budget)}</td>
      <td class="num">${fmtMoney(p.invoiced)}</td>
      <td class="progress-cell">
        <div style="display:flex;align-items:center;gap:5px">
          <div class="progress-bg" style="flex:1"><div class="progress-fill" style="width:${Math.min(100,p.pct)}%"></div></div>
          <span style="font-size:.7rem;color:#aaa;min-width:32px">${p.pct}%</span>
        </div>
      </td>
      <td class="num">${p.sqft?p.sqft.toLocaleString():'—'}</td>
      <td style="color:#8a9ac0">${p.class||'—'}</td>`;
    tbody.appendChild(tr);
  });
}

// ── Init ──────────────────────────────────────────────────────
populateFilters();
renderLegend();
render(PROJECTS);
renderTable(PROJECTS);

// expand all bodies after render
setTimeout(()=>{
  ['AMERICAS','APAC-N','APAC-S','EMEA'].forEach(css=>{
    const body=document.getElementById(`body-${css}`);
    if(body) body.style.maxHeight=body.scrollHeight+'px';
  });
},100);
</script>
